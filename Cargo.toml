[package]
name = "redis-explorer"
version = "0.1.1"
edition = "2021"
description = "A web UI for browsing Redis keys and values"

[dependencies]
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
redis = { version = "1.7", default-features = false, features = ["tokio-rustls-comp", "cluster-async", "sentinel", "streams", "tls-rustls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
